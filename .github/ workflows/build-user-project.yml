name: Build user project APK
run-name: Build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: Path of the project zip inside this repo
        required: true
      job_id:
        description: Unique job id
        required: true
      java_version:
        description: "auto, 8, 11, 17 or 21"
        default: auto
      gradle_version:
        description: "Optional Gradle override (e.g. 8.10.2). Empty = keep the project's"
        default: ""
      build_task:
        description: Gradle task(s)
        default: assembleDebug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_ID: ${{ inputs.job_id }}
      ZIP_PATH: ${{ inputs.zip_path }}
      REQ_JAVA: ${{ inputs.java_version }}
      REQ_GRADLE: ${{ inputs.gradle_version }}
      BUILD_TASK: ${{ inputs.build_task }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # All four JDKs are installed; JAVA_HOME_8_X64 ... JAVA_HOME_21_X64 get defined.
      - name: Install JDK 8, 11, 17, 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Unzip project
        run: |
          set -euo pipefail
          test -f "$ZIP_PATH" || { echo "::error::zip not found: $ZIP_PATH"; exit 1; }
          rm -rf work && mkdir work
          unzip -q -o "$ZIP_PATH" -d work -x '__MACOSX/*' '*/.DS_Store'
          ROOT=$(find work -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/__MACOSX/*' -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2- || true)
          if [ -z "$ROOT" ]; then
            ROOT=$(find work -maxdepth 6 \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/__MACOSX/*' -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2- || true)
          fi
          [ -n "$ROOT" ] || { echo "::error::No Gradle project found in the zip"; exit 1; }
          ROOT=$(realpath "$ROOT")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Detect Gradle / Java
        run: |
          set -euo pipefail
          cd "$ROOT"

          # ---- Gradle version ----
          GV=""
          WP=gradle/wrapper/gradle-wrapper.properties
          if [ -n "$REQ_GRADLE" ] && [ -f "$WP" ]; then
            sed -i -E "s#gradle-[0-9]+(\.[0-9]+)*(-rc-[0-9]+|-milestone-[0-9]+)?-(bin|all)\.zip#gradle-${REQ_GRADLE}-bin.zip#" "$WP"
            sed -i '/distributionSha256Sum/d' "$WP"
          fi
          if [ -n "$REQ_GRADLE" ]; then
            GV="$REQ_GRADLE"
          elif [ -f "$WP" ]; then
            GV=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*' "$WP" | head -1 | sed 's/gradle-//' || true)
          fi
          echo "Gradle: ${GV:-none}"

          # ---- Java level requested by the sources ----
          HINT=$(grep -rhoE --include='*.gradle' --include='*.kts' --include='*.toml' --exclude-dir=build --exclude-dir=.git \
            -e 'VERSION_[0-9]+(_[0-9]+)?' \
            -e 'jvmTarget[^0-9]{0,6}[0-9]+(\.[0-9]+)?' \
            -e 'JavaLanguageVersion\.of\([0-9]+' \
            -e 'jvmToolchain\([0-9]+' \
            -e '(source|target)Compatibility[^0-9]{0,6}[0-9]+(\.[0-9]+)?' . 2>/dev/null \
            | grep -oE '[0-9]+([._][0-9]+)?$' \
            | awk '{v=$0; if (v ~ /^1[._][0-9]+$/) sub(/^1[._]/,"",v); sub(/[._].*/,"",v); print v+0}' \
            | sort -n | tail -1 || true)
          HINT=${HINT:-8}
          if [ "$HINT" -gt 21 ]; then HINT=21; fi
          if [ "$HINT" -lt 8 ]; then HINT=8; fi
          echo "Source Java level hint: $HINT"

          # ---- What the Gradle version can run on ----
          if [ -z "$GV" ]; then BASE=17; MAX=21
          else
            major=${GV%%.*}; rest=${GV#*.}; minor=${rest%%.*}
            if [ "$rest" = "$GV" ]; then minor=0; fi
            if   [ "$major" -le 5 ]; then BASE=8;  MAX=8
            elif [ "$major" -eq 6 ]; then BASE=8;  MAX=11
            elif [ "$major" -eq 7 ]; then BASE=11; if [ "$minor" -ge 3 ]; then MAX=17; else MAX=11; fi
            elif [ "$major" -eq 8 ]; then BASE=17; if [ "$minor" -ge 5 ]; then MAX=21; else MAX=17; fi
            else BASE=17; MAX=21; fi
          fi
          EFF=$HINT
          if [ "$EFF" -gt "$MAX" ]; then
            echo "::warning::Project wants Java $HINT but Gradle ${GV:-?} supports up to $MAX. Pass gradle_version (e.g. 8.10.2) to upgrade."
            EFF=$MAX
          fi
          if   [ "$EFF" -le 8 ];  then JDK=8
          elif [ "$EFF" -le 11 ]; then JDK=11
          elif [ "$EFF" -le 17 ]; then JDK=17
          else JDK=21; fi
          if [ "$JDK" -lt "$BASE" ]; then JDK=$BASE; fi
          if [ "$REQ_JAVA" != "auto" ] && [ -n "$REQ_JAVA" ]; then JDK=$REQ_JAVA; fi

          VAR="JAVA_HOME_${JDK}_X64"
          JH="${!VAR}"
          [ -d "$JH" ] || { echo "::error::JDK $JDK not available (use 8, 11, 17 or 21)"; exit 1; }
          echo "Using JDK $JDK at $JH"
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"
          echo "JDK=$JDK" >> "$GITHUB_ENV"
          echo "GV=$GV" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager needs a modern JDK regardless of the project's JDK
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > "$ROOT/local.properties"
          APIS=$(cd "$ROOT" && grep -rhoE --include='*.gradle' --include='*.kts' --include='*.toml' --exclude-dir=build \
            -e 'compileSdk(Version)?[^0-9]{0,6}[0-9]+' -e 'compile_sdk[^0-9]{0,6}[0-9]+' -e 'targetSdk(Version)?[^0-9]{0,6}[0-9]+' . 2>/dev/null \
            | grep -oE '[0-9]+$' | sort -un || true)
          for api in $APIS; do
            echo "Installing platform android-$api"
            "$SDKM" "platforms;android-$api" >/dev/null 2>&1 || echo "  (skipped, AGP will try to download it)"
          done
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOT
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64
          org.gradle.daemon=false
          EOT
          sed -i 's/^ *//' ~/.gradle/gradle.properties

      - name: Build
        run: |
          set -uo pipefail
          cd "$ROOT"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            GR=./gradlew
          else
            case "$JDK" in
              8)  V=6.9.4 ;;
              11) V=7.6.4 ;;
              17) V=8.10.2 ;;
              *)  V=8.14.3 ;;
            esac
            if [ -n "${GV:-}" ]; then V="$GV"; fi
            echo "No usable wrapper, downloading Gradle $V"
            curl -fsSL "https://services.gradle.org/distributions/gradle-$V-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            GR="/opt/gradle-$V/bin/gradle"
          fi
          # shellcheck disable=SC2086
          $GR --no-daemon --console=plain --stacktrace $BUILD_TASK 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          n=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            cp "$f" "out/${JOB_ID}-${n}-$(basename "$f")"
          done < <(find "$ROOT" -path '*/build/outputs/apk/*' -name '*.apk' ! -name '*androidTest*' -print0)
          ls -la out
          [ "$n" -gt 0 ] || { echo "::error::Build finished but no APK was produced (try build_task=assembleDebug)"; exit 1; }

      - name: Publish release (APK download for the app)
        run: |
          gh release create "build-$JOB_ID" out/*.apk build.log \
            --title "Build $JOB_ID" --notes "Built by ApkForge" --target "$GITHUB_SHA"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.job_id }}
          path: build.log
          if-no-files-found: ignore

      - name: Remove uploaded zip from the repo
        if: always()
        run: |
          git rm -q "$ZIP_PATH" || exit 0
          git -c user.name="apkforge" -c user.email="apkforge@users.noreply.github.com" commit -qm "cleanup $JOB_ID"
          git push || true
