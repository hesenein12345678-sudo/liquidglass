
name: Build Android Project from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "incoming/project.zip"
      - ".github/workflows/build-uploaded-project.yml"

permissions:
  contents: read

concurrency:
  group: android-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extract uploaded Android project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="incoming/project.zip"
          DEST="$RUNNER_TEMP/android-project"
          UNPACK="$RUNNER_TEMP/unpacked-project"

          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::Upload your project ZIP to incoming/project.zip"
            exit 1
          fi

          if unzip -Z1 "$ARCHIVE" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::Unsafe path found in ZIP archive."
            exit 1
          fi

          mkdir -p "$UNPACK" "$DEST"
          unzip -q "$ARCHIVE" -d "$UNPACK"

          ROOT=""
          while IFS= read -r -d '' file; do
            DIR="$(dirname "$file")"
            if [ -f "$DIR/gradlew" ] &&
               { [ -f "$DIR/settings.gradle" ] ||
                 [ -f "$DIR/settings.gradle.kts" ]; }; then
              ROOT="$DIR"
              break
            fi
          done < <(
            find "$UNPACK" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$ROOT" ]; then
            echo "::error::No Gradle project with settings and gradlew found."
            echo "Include gradlew, gradle/wrapper, and settings.gradle(.kts) in your ZIP."
            exit 1
          fi

          cp -a "$ROOT"/. "$DEST"/
          echo "PROJECT_DIR=$DEST" >> "$GITHUB_ENV"

          echo "Project extracted successfully."
          ls -la "$DEST"

      - name: Detect Java version
        id: java
        shell: bash
        run: |
          set -euo pipefail
          DIR="$PROJECT_DIR"
          JAVA_VERSION=17

          for FILE in \
            "$DIR/gradle/libs.versions.toml" \
            "$DIR/build.gradle" \
            "$DIR/build.gradle.kts" \
            "$DIR/settings.gradle" \
            "$DIR/settings.gradle.kts"; do

            [ -f "$FILE" ] || continue

            if grep -Eq 'com\.android\.(application|library).*version.*9\.' "$FILE" ||
               grep -Eq 'com\.android\.tools\.build:gradle:9\.' "$FILE"; then
              JAVA_VERSION=17
            fi
          done

          echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using JDK $JAVA_VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -s gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle Wrapper properties are missing."
            exit 1
          fi

          chmod +x gradlew
          grep 'distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Fetch Backdrop components if required
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f tools/fetch_backdrop_catalog_components.sh ]; then
            chmod +x tools/fetch_backdrop_catalog_components.sh
            bash tools/fetch_backdrop_catalog_components.sh
          fi

      - name: Apply optional Backdrop compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          FILE="app/src/main/java/com/kyant/backdrop/catalog/utils/DampedDragAnimation.kt"

          if [ -f "$FILE" ] && grep -q 'awaitFrame()' "$FILE"; then
            python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s = s.replace("awaitFrame()", "withFrameNanos { }")

          imp = "import androidx.compose.runtime.withFrameNanos"
          if imp not in s:
              lines = s.splitlines()
              index = next(
                  (i for i, line in enumerate(lines)
                   if line.startswith("import ")),
                  -1
              )
              if index >= 0:
                  lines.insert(index, imp)
              else:
                  package_index = next(
                      (i for i, line in enumerate(lines)
                       if line.startswith("package ")),
                      -1
                  )
                  lines.insert(package_index + 1, "")
                  lines.insert(package_index + 2, imp)
              s = "\n".join(lines) + "\n"

          p.write_text(s)
          PY
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
