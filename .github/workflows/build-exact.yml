name: Build Backdrop Tabs

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail
          test -s BackdropCatalogExact.zip

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q BackdropCatalogExact.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backdrop-tabs-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
