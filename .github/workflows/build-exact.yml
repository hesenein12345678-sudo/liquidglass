name: Build Backdrop Tabs

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1"

      - name: Unzip project
        run: |
          set -euxo pipefail
          test -f BackdropCatalogExact.zip
          rm -rf project
          mkdir project
          unzip -q BackdropCatalogExact.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backdrop-tabs-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
