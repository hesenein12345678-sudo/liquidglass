name: Build Project
run-name: Build ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Upload id
        required: true
        type: string
      zip:
        description: "Zip path in repo (empty = uploads/<id>.zip)"
        required: false
        default: ''
        type: string
      task:
        description: Gradle task
        required: false
        default: assembleDebug
        type: string
      java:
        description: Java version (auto = detect from Gradle)
        required: false
        default: auto
        type: string

permissions:
  contents: write

env:
  ID: ${{ inputs.id }}
  TASK: ${{ inputs.task }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and detect
        id: prep
        shell: bash
        env:
          JAVA_IN: ${{ inputs.java }}
          ZIP_IN: ${{ inputs.zip }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[a-z0-9]+$ ]] || { echo "::error::bad id"; exit 1; }
          [[ "$TASK" =~ ^[A-Za-z0-9:_.-]+$ ]] || { echo "::error::bad task"; exit 1; }
          rm -rf work && mkdir work
          ZIP="${ZIP_IN:-uploads/$ID.zip}"
          [[ "$ZIP" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$ZIP" != *..* ]] || { echo "::error::bad zip path"; exit 1; }
          [ -f "$ZIP" ] || { echo "::error::zip not found: $ZIP"; exit 1; }
          unzip -q "$ZIP" -d work
          SETTINGS=$(find work -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/__MACOSX/*' | awk -F/ '{print NF, $0}' | sort -n | sed -n 1p | cut -d' ' -f2-)
          [ -n "$SETTINGS" ] || { echo "::error::settings.gradle(.kts) not found in zip"; exit 1; }
          DIR=$(dirname "$SETTINGS")
          # files that break builds when the project was made on another machine
          rm -f "$DIR/local.properties"
          if [ -f "$DIR/gradle.properties" ]; then sed -i '/^org\.gradle\.java\.home/d' "$DIR/gradle.properties"; fi
          GV=""
          PROPS="$DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            GV=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*' "$PROPS" | sed -n 1p | sed 's/^gradle-//' || true)
          fi
          WRAPPER=false
          if [ -f "$DIR/gradlew" ] && [ -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ]; then WRAPPER=true; fi
          [ -n "$GV" ] || GV=9.5.0
          IFS=. read -r MA MI _ <<< "$GV"
          MI=${MI:-0}
          N=$((10#$MA*100 + 10#$MI))
          if [ -n "$JAVA_IN" ] && [ "$JAVA_IN" != "auto" ]; then JV="$JAVA_IN"
          elif [ "$N" -ge 901 ]; then JV=25
          elif [ "$N" -ge 805 ]; then JV=21
          else JV=17; fi
          { echo "dir=$DIR"; echo "wrapper=$WRAPPER"; echo "gradle=$GV"; echo "java=$JV"; } >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR | Gradle: $GV | wrapper: $WRAPPER | Java: $JV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.prep.outputs.java }}

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install latest platform and build-tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          LIST=$(sdkmanager --list 2>/dev/null || true)
          PL=$(echo "$LIST" | grep -oE 'platforms;android-[0-9]+(\.[0-9]+)?' | sort -uV | tail -n 1 || true)
          BT=$(echo "$LIST" | grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -n 1 || true)
          echo "Installing: $PL $BT"
          sdkmanager "platform-tools" "$PL" "$BT" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.prep.outputs.wrapper == 'true' && 'wrapper' || steps.prep.outputs.gradle }}

      - name: Build
        working-directory: ${{ steps.prep.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ steps.prep.outputs.wrapper }}" = "true" ]; then
            chmod +x gradlew
            ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            gradle "$TASK" --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Collect APKs
        shell: bash
        env:
          DIR: ${{ steps.prep.outputs.dir }}
        run: |
          mkdir -p out
          find "$DIR" -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} out/ \;
          ls out/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.id }}
          path: out/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ inputs.id }}
          path: build.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Remove uploaded zip
        if: always()
        shell: bash
        run: |
          if [ -f "uploads/$ID.zip" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -q "uploads/$ID.zip"
            git commit -qm "cleanup $ID [skip ci]"
            for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 4; done
          fi
