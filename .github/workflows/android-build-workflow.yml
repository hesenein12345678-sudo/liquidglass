name: Android CI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper availability
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is missing. Generate it with Gradle 8.9: gradle wrapper --gradle-version 8.9"
            exit 1
          fi
          chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-music-debug
          path: app/build/outputs/apk/debug/*.apk
