name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        id: proj
        shell: bash
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            DIR="."
          else
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then echo "No project and no zip file found"; exit 1; fi
            echo "Unzipping $ZIP"
            mkdir -p _project
            unzip -q -o "$ZIP" -d _project
            S=$(find _project -name settings.gradle.kts | head -n 1)
            if [ -z "$S" ]; then echo "settings.gradle.kts not found inside zip"; exit 1; fi
            DIR=$(dirname "$S")
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (use preinstalled SDK)
        shell: bash
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          echo "Licenses accepted"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotGlass-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
