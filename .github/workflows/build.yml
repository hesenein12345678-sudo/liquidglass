name: Build Backdrop Catalog APK

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # IMPORTANT: no Gradle cache here.
          # The Android project is intentionally stored inside project.zip.

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -s project.zip
          unzip -tq project.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-project
          mkdir -p android-project
          unzip -q project.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Build debug APK
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backdrop-catalog-debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
