name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and find project
        id: proj
        run: |
          unzip -q liquidglass.zip -d extracted
          FILE=$(find extracted -name settings.gradle.kts -not -path "*/__MACOSX/*" | head -1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found"
            find extracted | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          V=$(grep distributionUrl "$DIR/gradle/wrapper/gradle-wrapper.properties" | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "gradle=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.proj.outputs.gradle }}
      - run: gradle assembleDebug
        working-directory: ${{ steps.proj.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk