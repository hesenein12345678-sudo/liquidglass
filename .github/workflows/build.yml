name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in the repository root. Upload the project .zip next to README.md."
            exit 1
          fi
          echo "Found project archive: $ZIP_FILE"
          mkdir -p _project
          unzip -q -o "$ZIP_FILE" -d _project
          SETTINGS=$(find _project -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found inside the zip."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already ships with the Android SDK (ANDROID_HOME), so no extra setup action is needed.
      - name: Accept licenses and install SDK platform
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          yes | "$SDKM" "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          exit 0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the real error (short)
        if: failure()
        run: |
          {
            echo "### Build error"
            echo '```'
            grep -A15 "What went wrong" "$GITHUB_WORKSPACE/build.log" | head -n 40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -A6 "What went wrong" "$GITHUB_WORKSPACE/build.log" | head -n 10 | while read -r l; do echo "::error::$l"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
