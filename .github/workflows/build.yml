name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        id: locate
        run: |
          # لو رفعت ملف zip بدون فك ضغط، يتم فكه تلقائياً
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            find . -maxdepth 3 -name '*.zip' -not -path './.git/*' | while read -r z; do
              echo "Unzipping $z"
              unzip -oq "$z" -d _unzipped
            done
          fi
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found. Repo content:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageResizer-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
