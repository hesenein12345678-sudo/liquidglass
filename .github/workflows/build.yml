name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q NoAdaForApk.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/gradlew
          test -f project/gradle/wrapper/gradle-wrapper.jar
          test -f project/gradle/wrapper/gradle-wrapper.properties
          test -f project/app/src/main/AndroidManifest.xml

          grep -q 'com.android.tools.build:gradle:8.2.2' project/build.gradle
          grep -q 'gradle-8.2-bin.zip' project/gradle/wrapper/gradle-wrapper.properties
          grep -q 'applicationId "com.android.app.no.ads.for.apk"' project/app/build.gradle
          grep -q 'package="com.android.app.no.ads.for.apk"' project/app/src/main/AndroidManifest.xml

          chmod +x project/gradlew

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoAdaForApk-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
