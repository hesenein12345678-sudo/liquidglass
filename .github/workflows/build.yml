name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q NoAdaForApk.zip -d project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml
          chmod +x project/gradlew

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoAdaForApk-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
