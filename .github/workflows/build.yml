name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::ما لقيت ملف zip بجذر المستودع. ارفع LinkSkip.zip"
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::ما لقيت settings.gradle داخل الـ zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find "$PROJECT_DIR" -path '*outputs/apk/release/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::ما انبنى ملف APK"
            exit 1
          fi
          cp "$APK" out/LinkSkip.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkSkip-apk
          path: out/LinkSkip.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LinkSkip build ${{ github.run_number }}
          files: out/LinkSkip.apk
          make_latest: true
