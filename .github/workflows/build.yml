name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Find and Extract Zip Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_temp/
          BUILD_DIR=$(find extracted_temp/ -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          if [ -n "$BUILD_DIR" ]; then
            echo "Moving project files from $BUILD_DIR to root..."
            cp -r $BUILD_DIR/* ./
          fi
          rm -rf extracted_temp
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Use Gradle 8.0 Wrapper
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
