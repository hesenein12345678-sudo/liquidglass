name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # إذا رفعت المشروع كملف ImageResizer.zip يفك ضغطه، وإذا رفعته مفتوح يكمل عادي
      - name: Unzip project (if zipped) and locate it
        shell: bash
        run: |
          set -e
          if [ -f "ImageResizer.zip" ]; then
            echo "Found ImageResizer.zip -> extracting"
            unzip -q -o ImageResizer.zip -d _unzipped
          fi
          SETTINGS=$(find . -name "settings.gradle.kts" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found!"; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"
          ls -la "$DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # يثبّت Android SDK ويقبل التراخيص (AGP ينزّل منصة compileSdk 37 تلقائياً)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # المشروع ما فيه gradlew، فنثبّت نفس نسخة Gradle المطلوبة (9.7.1) مباشرة
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build debug + release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ImageResizer-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
